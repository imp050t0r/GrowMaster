<!doctype html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#143c2f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/growmaster-192.png" />
  <link rel="stylesheet" href="/pos.css" />
  <style>
    .mode-active{background:#143c2f!important;color:#fff!important;border-color:#143c2f!important}
    .write-off-reason{display:block;margin-top:14px;font-size:.85rem;font-weight:800;color:#5e7067}
    .write-off-reason select{display:block;width:100%;min-height:48px;margin-top:6px;border:1px solid #cbd7d0;border-radius:12px;padding:0 12px;background:#fff;font-size:1rem}
    .pay.write-off{width:100%;margin-top:14px;background:#8a3c20;color:#fff;border-color:#8a3c20}
    .day-dialog{width:min(620px,calc(100% - 24px));border:0;border-radius:18px;padding:0;box-shadow:0 18px 60px #0004}.day-dialog::backdrop{background:#10251dbb}.day-box{padding:20px}.day-head{display:flex;justify-content:space-between;gap:12px}.day-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.day-card{padding:12px;border-radius:12px;background:#f2f6f3}.day-card span{display:block;color:#65766d;font-size:.8rem}.day-card strong{font-size:1.25rem}.day-input{display:block;margin:12px 0}.day-input input{width:100%;min-height:48px;margin-top:5px;border:1px solid #cbd7d0;border-radius:10px;padding:0 12px;font-size:1rem}.day-actions{display:flex;gap:10px;justify-content:flex-end}.day-actions button{min-height:48px;padding:0 16px;border-radius:10px;font-weight:800}
  </style>
  <title>GrowMaster POS</title>
</head>
<body>
  <main class="pos-shell">
    <header class="pos-header">
      <div><span class="eyebrow">GrowMaster</span><h1>Prodaja</h1></div>
      <div class="sync-box">
        <span id="connection" class="pill offline">● BREZ POVEZAVE</span>
        <span id="syncState">0 čaka</span>
      </div>
    </header>

    <section id="message" class="message" hidden></section>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Poišči artikel…" autocomplete="off" />
      <button id="saleMode" type="button" class="secondary mode-active">PRODAJA</button>
      <button id="writeOffMode" type="button" class="secondary">ODPIS</button>
      <button id="returnMode" type="button" class="secondary">VRAČILO</button>
      <button id="dayCloseOpen" type="button" class="secondary">DAN</button>
      <button id="historyOpen" type="button" class="secondary">ZGODOVINA</button>
      <button id="unitsOpen" type="button" class="secondary">ENOTE</button>
      <button id="stocktakeOpen" type="button" class="secondary">INVENTURA</button>
      <button id="pickupOpen" type="button" class="secondary">PREVZEMI</button>
      <button id="refresh" type="button" class="secondary">OSVEŽI</button>
      <a class="secondary link-button" href="/">GROWMASTER</a>
    </section>

    <div class="layout">
      <section>
        <div id="inventoryMeta" class="meta">Nalagam zalogo…</div>
        <div id="products" class="product-grid" aria-live="polite"></div>
      </section>

      <aside class="cart-panel">
        <div class="cart-heading"><h2 id="cartTitle">Račun</h2><button id="clearCart" type="button" class="text-button">POČISTI</button></div>
        <div id="cart" class="cart-list"><p class="empty">Izberi artikel.</p></div>
        <div class="quick-qty" aria-label="Hitra količina">
          <button type="button" data-qty="0.1">+ 0,10 kg</button>
          <button type="button" data-qty="0.25">+ 0,25 kg</button>
          <button type="button" data-qty="0.5">+ 0,50 kg</button>
          <button type="button" data-qty="1">+ 1,00 kg</button>
        </div>
        <label class="custom-qty">Količina izbranega artikla (kg)
          <div><input id="quantity" inputmode="decimal" type="number" min="0.01" step="0.01" placeholder="0,00" /><button id="addQuantity" type="button">DODAJ</button></div>
        </label>
        <div class="total"><span>Skupaj</span><strong id="total">0,00 €</strong></div>
        <label id="writeOffReasonBox" class="write-off-reason" hidden>Razlog odpisa
          <select id="writeOffReason">
            <option value="unsold">Neprodano</option>
            <option value="spoiled">Pokvarjeno</option>
            <option value="damaged">Poškodovano</option>
            <option value="quality">Neustrezna kakovost</option>
            <option value="other">Drugo</option>
          </select>
        </label>
        <div id="returnOptions" hidden>
          <label class="write-off-reason">Razlog vračila
            <select id="returnReason">
              <option value="customer_return">Vračilo kupca</option>
              <option value="quality">Neustrezna kakovost</option>
              <option value="damaged">Poškodovano</option>
              <option value="other">Drugo</option>
            </select>
          </label>
          <label class="write-off-reason"><input id="returnToStock" type="checkbox" /> Vrni uporabno blago na zalogo</label>
        </div>
        <div class="payment-buttons">
          <button id="payCash" type="button" class="pay primary">GOTOVINA</button>
          <button id="payCard" type="button" class="pay secondary">KARTICA</button>
        </div>
        <button id="confirmWriteOff" type="button" class="pay write-off" hidden>ODPIŠI IZ ZALOGE</button>
        <button id="confirmReturn" type="button" class="pay write-off" hidden>VRNI BLAGO IN DENAR</button>
        <p class="hint">Če povezave ni, se prodaja varno shrani na tej napravi in prenese v GrowMaster ob naslednji povezavi.</p>
      </aside>
    </div>
  </main>
  <dialog id="dayDialog" class="day-dialog">
    <div class="day-box">
      <div class="day-head"><div><span class="eyebrow">POS</span><h2>Dnevni pregled</h2></div><button id="dayCloseX" type="button" class="text-button">ZAPRI</button></div>
      <label class="day-input">Začetna gotovina (€)<input id="openingCash" type="number" min="0" step="0.01" value="0" inputmode="decimal" /></label>
      <div id="daySummary" class="day-grid"></div>
      <label class="day-input">Prešteta gotovina (€)<input id="countedCash" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0,00" /></label>
      <label class="day-input">Opomba<input id="dayNotes" maxlength="2000" placeholder="Neobvezno" /></label>
      <div class="day-actions"><button id="dayRefresh" type="button" class="secondary">OSVEŽI</button><button id="dayConfirm" type="button" class="pay primary">ZAKLJUČI DAN</button></div>
    </div>
  </dialog>
  <dialog id="workDialog" class="day-dialog"><div class="day-box"><div class="day-head"><h2 id="workTitle">Pregled</h2><button id="workClose" type="button" class="text-button">ZAPRI</button></div><div id="workBody"></div></div></dialog>
  <script src="/pos.js" defer></script>
</body>
</html>
