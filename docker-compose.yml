services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-growmaster}
      POSTGRES_USER: ${POSTGRES_USER:-growmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - "${POSTGRES_DATA_SOURCE:-growmaster_postgres}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-growmaster} -d ${POSTGRES_DB:-growmaster}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://growmaster:change-me@database:5432/growmaster}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      GROWMASTER_DATA_ROOT: ${GROWMASTER_DATA_ROOT:-}
      GROWMASTER_WINDOWS_INSTALL: ${GROWMASTER_WINDOWS_INSTALL:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost,https://localhost,capacitor://localhost}
    volumes:
      - "${BACKUP_DATA_SOURCE:-growmaster_backups}:/data/backups"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  growmaster_postgres:
  growmaster_backups:
