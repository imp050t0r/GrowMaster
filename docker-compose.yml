services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-growmaster}
      POSTGRES_USER: ${POSTGRES_USER:-growmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - growmaster_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-growmaster} -d ${POSTGRES_DB:-growmaster}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://growmaster:change-me@database:5432/growmaster}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - growmaster_backups:/data/backups
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:5173"

volumes:
  growmaster_postgres:
  growmaster_backups:
