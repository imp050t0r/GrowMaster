name: Platform builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "installer/**"
      - "branding/**"
      - "scripts/build_*icons.py"
      - ".github/workflows/platform-builds.yml"
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python scripts/build_brand_assets.py
      - name: Validate launcher scripts
        shell: pwsh
        run: |
          $errors = @()
          [System.Management.Automation.Language.Parser]::ParseFile("installer/Start-GrowMaster.ps1", [ref]$null, [ref]$errors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile("installer/Stop-GrowMaster.ps1", [ref]$null, [ref]$errors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile("installer/Move-GrowMasterData.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error }
      - name: Test data-folder migration helpers on Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "installer/Move-GrowMasterData.ps1" -SelfTest
      - name: Validate Windows PowerShell 5.1 cryptography
        shell: powershell
        run: |
          $launcher = Get-Content "installer/Start-GrowMaster.ps1" -Raw
          if ($launcher -match 'RandomNumberGenerator\]\s*::Fill') {
            throw "RandomNumberGenerator.Fill is unavailable in Windows PowerShell 5.1."
          }
          $random = New-Object byte[] 32
          $generator = [Security.Cryptography.RandomNumberGenerator]::Create()
          try { $generator.GetBytes($random) } finally { $generator.Dispose() }
          if (($random | Where-Object { $_ -ne 0 }).Count -eq 0) {
            throw "Secure random byte generation failed."
          }
      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build setup executable
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\GrowMaster.iss"'
      - uses: actions/upload-artifact@v4
        with:
          name: GrowMaster-Windows-Setup
          path: installer/output/GrowMaster-Setup-*.exe
          retention-days: 30

  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build && npx cap add android && npx cap sync android
      - run: python scripts/build_native_icons.py
      - working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GrowMaster-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build && npx cap add ios && npx cap sync ios
      - run: python scripts/build_native_icons.py
      - name: Build unsigned iPhone simulator app
        working-directory: frontend
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-installer, android-app, ios-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GrowMaster-Windows-Setup
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: GrowMaster-Android-APK
          path: release/android
      - name: Prepare release files
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv release/android/app-debug.apk "release/GrowMaster-Android-${version}.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/windows/GrowMaster-Setup-*.exe \
            release/GrowMaster-Android-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "GrowMaster ${GITHUB_REF_NAME#v}" \
            --generate-notes
