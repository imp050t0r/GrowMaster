name: Platform builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "installer/**"
      - "branding/**"
      - "scripts/build_*icons.py"
      - "scripts/sync_native_version.py"
      - ".github/workflows/platform-builds.yml"
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  cleanup-releases:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove all releases and tags except current version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(sed -n 's/export const APP_VERSION = "\([^"]*\)";/\1/p' frontend/src/version.js)"
          keep_tag="v${version}"
          echo "Keeping ${keep_tag}"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$tag" != "$keep_tag" ]; then
              echo "Deleting old release and tag: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/check_release_version.py
      - name: Build and verify desktop frontend
        shell: pwsh
        run: |
          Push-Location frontend
          npm install
          npm run build
          Pop-Location
          $version = (Select-String -Path "frontend/src/version.js" -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $bundle = (Get-ChildItem "frontend/dist/assets" -Filter "*.js" | Get-Content -Raw) -join "`n"
          if ($bundle -notmatch [Regex]::Escape($version)) { throw "Built frontend does not contain version $version." }
          if ($bundle -notmatch "OBNOVI IZ BACKUPA") { throw "Built frontend does not contain the Restore button." }
      - run: python -m pip install pillow
      - run: python scripts/build_brand_assets.py
      - name: Validate launcher scripts
        shell: pwsh
        run: |
          $errors = @()
          [System.Management.Automation.Language.Parser]::ParseFile("installer/Start-GrowMaster.ps1", [ref]$null, [ref]$errors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile("installer/Stop-GrowMaster.ps1", [ref]$null, [ref]$errors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile("installer/Move-GrowMasterData.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error }
      - name: Test data-folder migration helpers on Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "installer/Move-GrowMasterData.ps1" -SelfTest
      - name: Validate Windows PowerShell 5.1 cryptography
        shell: powershell
        run: |
          $launcher = Get-Content "installer/Start-GrowMaster.ps1" -Raw
          if ($launcher -match 'RandomNumberGenerator\]\s*::Fill') {
            throw "RandomNumberGenerator.Fill is unavailable in Windows PowerShell 5.1."
          }
          $random = New-Object byte[] 32
          $generator = [Security.Cryptography.RandomNumberGenerator]::Create()
          try { $generator.GetBytes($random) } finally { $generator.Dispose() }
          if (($random | Where-Object { $_ -ne 0 }).Count -eq 0) {
            throw "Secure random byte generation failed."
          }
      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build setup executable
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\GrowMaster.iss"'
      - uses: actions/upload-artifact@v4
        with:
          name: GrowMaster-Windows-Setup
          path: installer/output/GrowMaster-Setup-*.exe
          retention-days: 30

  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_release_version.py
      - run: python -m pip install pillow
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build && npx cap add android && npx cap sync android
      - run: python scripts/sync_native_version.py
      - run: python scripts/build_native_icons.py
      - name: Verify Android package version
        shell: bash
        run: |
          version="$(sed -n 's/export const APP_VERSION = "\([^"]*\)";/\1/p' frontend/src/version.js)"
          grep -F "versionName \"${version}\"" frontend/android/app/build.gradle
      - working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GrowMaster-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_release_version.py
      - run: python -m pip install pillow
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build && npx cap add ios && npx cap sync ios
      - run: python scripts/sync_native_version.py
      - run: python scripts/build_native_icons.py
      - name: Build unsigned iPhone simulator app
        working-directory: frontend
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows-installer, android-app, ios-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GrowMaster-Windows-Setup
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: GrowMaster-Android-APK
          path: release/android
      - name: Prepare release files
        id: release
        shell: bash
        run: |
          version="$(sed -n 's/export const APP_VERSION = "\([^"]*\)";/\1/p' frontend/src/version.js)"
          if [ -z "$version" ]; then
            echo "Could not read GrowMaster version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          mv release/android/app-debug.apk "release/GrowMaster-Android-${version}.apk"
      - name: Publish GitHub release when missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" \
              release/windows/GrowMaster-Setup-*.exe \
              release/GrowMaster-Android-*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "GrowMaster $VERSION" \
              --generate-notes
          fi
      - name: Remove older releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$tag" != "$KEEP_TAG" ]; then
              echo "Deleting old release and tag: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done
