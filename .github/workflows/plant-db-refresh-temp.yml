name: Plant DB refresh temp

on:
  push:
    branches:
      - feature/dandelion-varieties-mix-recipes

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[plant-db-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dandelion-varieties-mix-recipes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Plant DB
        run: python scripts/build_plant_db_release.py
      - name: Commit generated Plant DB
        run: |
          if git diff --quiet -- plant-db/latest; then
            echo "Plant DB already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plant-db/latest
          git commit -m "Refresh Plant DB 2026.08.27.3 [plant-db-refresh]"
          git push origin HEAD:feature/dandelion-varieties-mix-recipes
