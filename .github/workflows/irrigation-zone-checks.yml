name: Irrigation valve group checks
on:
  pull_request:
    paths:
      - "backend/app/irrigation_zone_planning.py"
      - "backend/tests/test_irrigation_zone_planning.py"
      - "backend/app/main.py"
      - "backend/app/models.py"
      - "backend/app/migrations.py"
      - "frontend/src/IrrigationValveGroups.jsx"
      - "frontend/src/IrrigationPlanner.jsx"
      - ".github/workflows/irrigation-zone-checks.yml"
  push:
    branches: [feature/irrigation-zone-planning]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Compile backend Python modules
        run: python -m compileall -q backend/app
      - name: Validate shared valve planting invariants
        run: cd backend && python -m pytest -q tests/test_irrigation_zone_planning.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Build frontend
        run: cd frontend && npm run build
